services:
  db:
    image: postgres:16
    container_name: bloomdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bloomdrop}
      POSTGRES_USER: ${POSTGRES_USER:-bloomdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloomdrop}
    ports:
      - "5432:5432"
    volumes:
      - bloomdrop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloomdrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bloomdrop_pgdata:
