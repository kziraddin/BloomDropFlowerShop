databases:
  - name: bloomdrop-db
    databaseName: bloomdrop
    user: bloomdrop
    plan: free

services:
  - type: web
    name: bloomdrop-backend
    runtime: docker
    plan: free
    rootDir: Implementation/backend_django
    dockerfilePath: ./Dockerfile
    preDeployCommand: python manage.py migrate
    healthCheckPath: /products/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloomdrop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: bloomdrop-backend.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      # Set this to the Vercel domain once the frontend is deployed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
